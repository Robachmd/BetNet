# Split deploy (frontend on Vercel, API on Render): use Dockerfile.backend and set SERVE_DJANGO_PAGES=false.
# Monolith (CRA baked in Docker, same hostname): replace dockerfilePath with ./Dockerfile and set
# REACT_APP_API_URL=/api on the service so the Node build stage receives it (see repo Dockerfile).
services:
  - type: web
    name: betnet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SERVE_DJANGO_PAGES
        value: "False"
      # Point these at your real Vercel URL(s); comma-separated, no spaces (django-environ list).
      # Example after first deploy — replace placeholders:
      # - key: CORS_ALLOWED_ORIGINS
      #   value: https://your-app.vercel.app,https://your-custom-domain.com
      # - key: CSRF_TRUSTED_ORIGINS
      #   value: https://your-app.vercel.app,https://your-custom-domain.com
      # Secrets: set in the Render dashboard (do not commit), or use fromDatabase below.
      # - SECRET_KEY
      #
      # DATABASE_URL: safest is linking Postgres to this service in the dashboard
      # (auto-injects), or add manually as a secret. Optional Blueprint wiring without
      # pasting the URL into git:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: your-render-postgres-service-name
      #     property: connectionString
      # See docs/render-database-url.md
      # - REDIS_URL (optional; without it Channels/Celery will fall back)
      # - ALLOWED_HOSTS (optional; Render hostname is auto-added by settings.py)

