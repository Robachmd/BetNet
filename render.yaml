services:
  - type: web
    name: betnet
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SERVE_DJANGO_PAGES
        value: "False"
      # Set these in the Render dashboard as "Secret" values:
      # - SECRET_KEY
      # - DATABASE_URL (use Render Postgres)
      # - REDIS_URL (optional; without it Channels/Celery will fall back)
      # - ALLOWED_HOSTS (optional; Render hostname is auto-added by settings.py)
      # - CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS (set to your Render URL)

