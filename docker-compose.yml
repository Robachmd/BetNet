services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: betnet
      POSTGRES_USER: betnet
      POSTGRES_PASSWORD: betnet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn betnet.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ───────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A betnet worker -l info --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (periodic tasks) ────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A betnet beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Channels / Daphne (WebSockets) ─────────────────────────────────────
  channels:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8001 betnet.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx (reverse proxy) ──────────────────────────────────────────────
  # frontend_builder copies CRA output into the volume mounted at nginx root (see nginx.conf
  # try_files for SPA). For API calls from the browser use same-origin /api: create
  # frontend/.env with REACT_APP_API_URL=/api, REACT_APP_WS_URL=ws://localhost, and
  # REACT_APP_UPLOADS_URL=http://localhost (or your public URL) before docker compose up.
  frontend_builder:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "npm ci &&
             npm run build &&
             rm -rf /frontend_build/* &&
             cp -r build/. /frontend_build/"
    volumes:
      - ./frontend:/app
      - frontend_build:/frontend_build
    env_file:
      - path: ./frontend/.env
        required: false

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      frontend_builder:
        condition: service_completed_successfully
      backend:
        condition: service_started
      channels:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
  media_volume:
  frontend_build:
